# The URL the site will be built for
base_url = "https://jaredforte.com/"
title = "Jared Forte"
description = "My personal website"
compile_sass = true
build_search_index = true

taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true, paginate_by = 10 },
]

[markdown.highlighting]
error_on_missing_language = true
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"

[extra]
author = "Jared Forte"

# Navigation links shown in the header and footer of every page.
[[extra.nav]]
name = "Home"
path = "/"

[[extra.nav]]
name = "Categories"
path = "/categories/"

[[extra.nav]]
name = "About me"
path = "/about-me/"
