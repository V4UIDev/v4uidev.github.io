{% extends "base.html" %}

{% block title %}{{ term.name }} | {{ config.title }}{% endblock title %}

{% block content %}
<section class="container">
    <p class="section-kicker">{{ taxonomy.name | capitalize }}</p>
    <h1 class="section-title">{{ term.name }}</h1>
    <div class="post-grid">
        {% for page in term.pages %}
        {{ <post_card page={page} /> }}
        {% endfor %}
    </div>
</section>
{% endblock content %}
