{% extends "base.html" %}

{% block title %}{{ section.title }} | {{ config.title }}{% endblock title %}

{% block content %}
<article class="post">
    <header class="post-hero">
        <div class="post-hero__inner container container--narrow">
            <h1 class="post-header__title">{{ section.title }}</h1>
        </div>
    </header>
    <div class="prose container container--narrow">
        {{ section.content | safe }}
    </div>
</article>
{% endblock content %}
